name: Build and synthetic tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pure Java and Python tests
        run: ./tests/run.sh
      - name: Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: ./build.sh
      - name: Check for accidentally tracked private artifacts
        run: python3 tools/check_public_tree.py
